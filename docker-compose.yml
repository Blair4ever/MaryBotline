version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mary_user
      POSTGRES_PASSWORD: mary_password
      POSTGRES_DB: mary_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mary_user -d mary_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mary-api:
    build: .
    container_name: mary-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DEBUG: "False"
      DATABASE_URL: postgresql+asyncpg://mary_user:mary_password@db:5432/mary_db
      TIMEZONE: Asia/Bangkok
    env_file:
      - .env

volumes:
  postgres_data:

